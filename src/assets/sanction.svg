      <rect x="0" y="0" width="512" height="512" fill="#fff"/>
      <text x="245" y="288" text-anchor="middle" font-family="'Arial Rounded MT Bold', 'Arial Black', Arial, Helvetica, sans-serif" font-weight="900" font-size="88" fill="#000" stroke="#000" stroke-width="4" stroke-linejoin="round" textLength="440" lengthAdjust="spacingAndGlyphs">SANCTION</text>
      <path d="M385 48 L385 100" stroke="#000" stroke-width="13" stroke-linecap="round"/>
