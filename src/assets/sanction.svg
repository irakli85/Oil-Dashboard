    <polygon points="398,26 472,150 425,150" fill="#FFDF4F" stroke="#FFDF4F" stroke-width="22" stroke-linejoin="round" opacity="0.9"/>
    <polygon points="385,20 300,150 472,150" fill="none" stroke="#FFE766" stroke-width="22" stroke-linejoin="round" opacity="0"/>
    <path d="M385 48 L385 100" stroke="#FF8088" stroke-width="13" stroke-linecap="round"/>
    <circle cx="385" cy="128" r="8" fill="#FF8088"/>
