<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- arcs -->
  <g fill="none" stroke="#FF8088" stroke-width="22" stroke-linecap="round">
    <path d="M68 148 A215 215 0 0 1 340 56"/>
    <path d="M170 150 A135 135 0 0 1 300 126"/>
    <path d="M58 378 A233 233 0 0 0 455 378"/>
    <path d="M145 378 A165 165 0 0 0 370 378"/>
  </g>

  <defs>
