    </mask>
  </defs>

  <!-- banner -->
  <g mask="url(#sanctionTextCutout)">
    <rect x="2" y="192" width="508" height="145" rx="14" fill="#FF9AA2"/>
    <path d="M468 192 H496 A14 14 0 0 1 510 206 V323 A14 14 0 0 1 496 337 H468 Z" fill="#FF8088"/>
